x-production-defaults: &production-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  backend:
    <<: *production-defaults
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${TRUSTED_PROXY_IPS:?Set TRUSTED_PROXY_IPS in the production environment file}
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production environment file}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the production environment file}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the production environment file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the production environment file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the production environment file}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in the production environment file}
      PASSWORD_RESET_RESEND_COOLDOWN_SECONDS: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:-60}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in the production environment file}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      EXPOSE_LOCAL_PASSWORD_RESET_TOKEN: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the production environment file}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in the production environment file}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:?Set COOKIE_SAMESITE in the production environment file}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in the production environment file}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      PAYMENT_PROVIDER: disabled
      PAYMOB_API_KEY: ""
      PAYMOB_SECRET_KEY: ""
      PAYMOB_PUBLIC_KEY: ""
      PAYMOB_HMAC_SECRET: ""
      PAYMOB_INTEGRATION_ID: ""
      PAYMOB_EXPECTED_CALLBACK_OWNER: ""
      PAYMOB_MERCHANT_ID: ""
      PAYMOB_IFRAME_ID: ""
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_WEBHOOK_URL: ${PAYMOB_WEBHOOK_URL:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-EGP}
      PAYMENT_SANDBOX_MODE: "true"
      PAYMENT_HTTP_TIMEOUT_SECONDS: ${PAYMENT_HTTP_TIMEOUT_SECONDS:-10}
      BILLING_WEBHOOK_QUEUE_NAME: ${BILLING_WEBHOOK_QUEUE_NAME:-billing-webhooks}
      BILLING_WEBHOOK_MAX_RETRIES: ${BILLING_WEBHOOK_MAX_RETRIES:-5}
      BILLING_GRACE_PERIOD_DAYS: ${BILLING_GRACE_PERIOD_DAYS:-7}
      BILLING_INCOMPLETE_EXPIRY_HOURS: ${BILLING_INCOMPLETE_EXPIRY_HOURS:-24}
      BILLING_SUSPENSION_EXPIRY_DAYS: ${BILLING_SUSPENSION_EXPIRY_DAYS:-30}
      BILLING_ENTITLEMENTS_ENFORCED: ${BILLING_ENTITLEMENTS_ENFORCED:?Set true in production}
      ENVIRONMENT: production
      APP_ENV: production
      ENABLE_API_DOCS: "false"
      DEMO_TOOLS_ENABLED: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER in the production environment file}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in the production environment file}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-FactoryMind by FK Solutions}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SUPPORT_NOTIFICATION_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:?Set SUPPORT_NOTIFICATION_EMAIL in the production environment file}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-3}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-5}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-transactional-email}
      EMAIL_RECONCILIATION_SCHEDULING_ENABLED: ${EMAIL_RECONCILIATION_SCHEDULING_ENABLED:-true}
      EMAIL_RECONCILIATION_INTERVAL_SECONDS: ${EMAIL_RECONCILIATION_INTERVAL_SECONDS:-60}
      EMAIL_PROCESSING_STALE_SECONDS: ${EMAIL_PROCESSING_STALE_SECONDS:-300}
      EMAIL_RECONCILIATION_BATCH_SIZE: ${EMAIL_RECONCILIATION_BATCH_SIZE:-100}
      EMAIL_VERIFICATION_REQUIRED: "true"
      EMAIL_VERIFICATION_EXPIRE_HOURS: ${EMAIL_VERIFICATION_EXPIRE_HOURS:-24}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      EXPOSE_LOCAL_EMAIL_VERIFICATION_TOKEN: "false"
      TEAM_INVITATION_EXPIRE_HOURS: ${TEAM_INVITATION_EXPIRE_HOURS:-72}
      TEAM_INVITATION_RESEND_COOLDOWN_SECONDS: ${TEAM_INVITATION_RESEND_COOLDOWN_SECONDS:-60}
      EXPOSE_LOCAL_TEAM_INVITATION_TOKEN: "false"
      LOG_ENVIRONMENT: production
      OBSERVABILITY_ENVIRONMENT: production
      OTEL_ENVIRONMENT: production
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
    ports: !reset []
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json,os,urllib.request; raw=os.environ['ALLOWED_HOSTS']; hosts=json.loads(raw) if raw.lstrip().startswith('[') else raw.split(','); host=hosts[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/ready',headers={'Host':host}); response=urllib.request.urlopen(request,timeout=5); raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=1770
    networks:
      - application
      - data
      - observability
      - egress
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 4.0
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "4.0"
        reservations:
          memory: 512m
          cpus: "1.0"

  training-worker:
    <<: *production-defaults
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production environment file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in the production environment file}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the production environment file}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in the production environment file}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the production environment file}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in the production environment file}
      PASSWORD_RESET_RESEND_COOLDOWN_SECONDS: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:-60}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in the production environment file}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the production environment file}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in the production environment file}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:?Set COOKIE_SAMESITE in the production environment file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in the production environment file}
      PAYMENT_PROVIDER: disabled
      PAYMOB_API_KEY: ""
      PAYMOB_SECRET_KEY: ""
      PAYMOB_PUBLIC_KEY: ""
      PAYMOB_HMAC_SECRET: ""
      PAYMOB_INTEGRATION_ID: ""
      PAYMOB_EXPECTED_CALLBACK_OWNER: ""
      PAYMOB_MERCHANT_ID: ""
      PAYMOB_IFRAME_ID: ""
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_WEBHOOK_URL: ${PAYMOB_WEBHOOK_URL:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-EGP}
      PAYMENT_SANDBOX_MODE: "true"
      PAYMENT_HTTP_TIMEOUT_SECONDS: ${PAYMENT_HTTP_TIMEOUT_SECONDS:-10}
      BILLING_WEBHOOK_QUEUE_NAME: ${BILLING_WEBHOOK_QUEUE_NAME:-billing-webhooks}
      BILLING_WEBHOOK_MAX_RETRIES: ${BILLING_WEBHOOK_MAX_RETRIES:-5}
      BILLING_GRACE_PERIOD_DAYS: ${BILLING_GRACE_PERIOD_DAYS:-7}
      BILLING_INCOMPLETE_EXPIRY_HOURS: ${BILLING_INCOMPLETE_EXPIRY_HOURS:-24}
      BILLING_SUSPENSION_EXPIRY_DAYS: ${BILLING_SUSPENSION_EXPIRY_DAYS:-30}
      BILLING_ENTITLEMENTS_ENFORCED: ${BILLING_ENTITLEMENTS_ENFORCED:?Set true in production}
      ENVIRONMENT: production
      APP_ENV: production
      ENABLE_API_DOCS: "false"
      DEMO_TOOLS_ENABLED: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER in the production environment file}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in the production environment file}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-FactoryMind by FK Solutions}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SUPPORT_NOTIFICATION_EMAIL: ${SUPPORT_NOTIFICATION_EMAIL:?Set SUPPORT_NOTIFICATION_EMAIL in the production environment file}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-3}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-5}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME:-transactional-email}
      EMAIL_RECONCILIATION_SCHEDULING_ENABLED: ${EMAIL_RECONCILIATION_SCHEDULING_ENABLED:-true}
      EMAIL_RECONCILIATION_INTERVAL_SECONDS: ${EMAIL_RECONCILIATION_INTERVAL_SECONDS:-60}
      EMAIL_PROCESSING_STALE_SECONDS: ${EMAIL_PROCESSING_STALE_SECONDS:-300}
      EMAIL_RECONCILIATION_BATCH_SIZE: ${EMAIL_RECONCILIATION_BATCH_SIZE:-100}
      EMAIL_VERIFICATION_REQUIRED: "true"
      EMAIL_VERIFICATION_EXPIRE_HOURS: ${EMAIL_VERIFICATION_EXPIRE_HOURS:-24}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      EXPOSE_LOCAL_EMAIL_VERIFICATION_TOKEN: "false"
      LOG_ENVIRONMENT: production
      OBSERVABILITY_ENVIRONMENT: production
      OTEL_ENVIRONMENT: production
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path; assert b'dramatiq' in Path('/proc/1/cmdline').read_bytes()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001,mode=1770
    networks:
      - data
      - observability
      - egress
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 0.75
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "0.75"
        reservations:
          memory: 512m
          cpus: "0.20"

  frontend:
    <<: *production-defaults
    build:
      target: production
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports: !reset []
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=1770
    networks:
      - application
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.15
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.15"
        reservations:
          memory: 32m
          cpus: "0.05"

  postgres:
    <<: *production-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
    ports: !reset []
    networks:
      - data
    stop_grace_period: 30s
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 0.75
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "0.75"
        reservations:
          memory: 512m
          cpus: "0.20"

  redis:
    <<: *production-defaults
    ports: !reset []
    networks:
      - data
    stop_grace_period: 20s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
        reservations:
          memory: 128m
          cpus: "0.05"

  reverse-proxy:
    <<: *production-defaults
    build:
      context: .
      dockerfile: docker/reverse-proxy/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=1770
    volumes:
      - ./infrastructure/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/routes.inc:/etc/nginx/routes.inc:ro
    networks:
      - public
      - application
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.10
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.10"
        reservations:
          memory: 32m
          cpus: "0.05"

  postgres-exporter:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [data, observability]
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.05
    deploy:
      resources:
        limits: {memory: 64m, cpus: "0.05"}
        reservations: {memory: 32m, cpus: "0.02"}

  redis-exporter:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [data, observability]
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.05
    deploy:
      resources:
        limits: {memory: 64m, cpus: "0.05"}
        reservations: {memory: 32m, cpus: "0.02"}

  cadvisor:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [observability]
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.10
    deploy:
      resources:
        limits: {memory: 128m, cpus: "0.10"}
        reservations: {memory: 64m, cpus: "0.03"}

  alertmanager:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [observability]
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.05
    deploy:
      resources:
        limits: {memory: 128m, cpus: "0.05"}
        reservations: {memory: 32m, cpus: "0.02"}

  prometheus:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [observability]
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.25
    deploy:
      resources:
        limits: {memory: 512m, cpus: "0.25"}
        reservations: {memory: 128m, cpus: "0.05"}

  loki:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [observability]
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.20
    deploy:
      resources:
        limits: {memory: 512m, cpus: "0.20"}
        reservations: {memory: 128m, cpus: "0.05"}

  alloy:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    environment:
      LOG_ENVIRONMENT: production
    networks: [observability]
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.10
    deploy:
      resources:
        limits: {memory: 192m, cpus: "0.10"}
        reservations: {memory: 64m, cpus: "0.03"}

  tempo:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    networks: [observability]
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.20
    deploy:
      resources:
        limits: {memory: 512m, cpus: "0.20"}
        reservations: {memory: 128m, cpus: "0.05"}

  grafana:
    <<: *production-defaults
    profiles: ["observability"]
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER when enabling observability}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD when enabling observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks: [observability]
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.10
    deploy:
      resources:
        limits: {memory: 256m, cpus: "0.10"}
        reservations: {memory: 64m, cpus: "0.03"}

networks:
  public:
  egress:
  application:
    internal: true
  data:
    internal: true
  observability:
    internal: true
