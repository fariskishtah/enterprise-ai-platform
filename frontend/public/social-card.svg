<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FactoryMind</title>
  <desc id="description">Industrial AI and operational intelligence for manufacturing teams</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#21194e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#6d4aff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(92 92)">
    <rect width="76" height="76" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.24"/>
    <rect x="18" y="18" width="16" height="16" rx="4" fill="#ffffff"/>
    <rect x="42" y="18" width="16" height="16" rx="4" fill="#c4b5fd"/>
    <rect x="18" y="42" width="16" height="16" rx="4" fill="#c4b5fd"/>
    <rect x="42" y="42" width="16" height="16" rx="4" fill="#ffffff"/>
  </g>
  <text x="196" y="145" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700">FactoryMind</text>
  <text x="92" y="300" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700">Industrial intelligence,</text>
  <text x="92" y="382" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="700">grounded in factory data.</text>
  <text x="92" y="468" fill="#d5d0e3" font-family="Inter, system-ui, sans-serif" font-size="30">Operational workflows · Governed AI · Grounded knowledge</text>
  <text x="92" y="548" fill="#c4b5fd" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600">factorymind.ddnsgeek.com</text>
</svg>
