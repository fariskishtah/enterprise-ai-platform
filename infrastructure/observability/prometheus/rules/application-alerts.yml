groups:
  - name: application-alerts
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: slo:http_availability:error_ratio_rate5m > 0.05
        for: 5m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: backend
          team: platform
          slo: http-availability
        annotations:
          summary: Backend API 5xx ratio is above 5%
          description: Eligible backend requests have exceeded a 5% server-error ratio for five minutes.
          runbook_url: docs/runbooks/api-high-error-rate.md
          dashboard_url: http://localhost:3000/d/backend-api

      - alert: APILatencyDegradation
        expr: slo:http_latency:error_ratio_rate5m > 0.20
        for: 10m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: backend
          team: platform
          slo: http-latency
        annotations:
          summary: More than 20% of API requests exceed 500 ms
          description: The API latency SLI has remained materially below its objective for ten minutes.
          runbook_url: docs/runbooks/api-latency-degradation.md
          dashboard_url: http://localhost:3000/d/backend-api

      - alert: BackgroundJobFailureBurst
        expr: |
          sum by (service, environment) (
            increase(background_jobs_processed_total{final_status="failed"}[15m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: training-worker
          team: platform
          slo: background-job-success
        annotations:
          summary: Background actors are failing repeatedly
          description: At least three bounded Dramatiq actor executions failed in the last 15 minutes.
          runbook_url: docs/runbooks/background-job-failures.md
          dashboard_url: http://localhost:3000/d/ai-operations

      - alert: PaymentWebhookFailures
        expr: |
          sum by (service, environment) (
            increase(billing_webhook_processing_latency_seconds_count{
              outcome=~"retry_scheduled|dead_letter"
            }[15m])
          ) > 0
        for: 2m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
          component: billing-webhook
          team: platform
          slo: background-job-success
        annotations:
          summary: Verified payment callbacks are failing during processing
          description: At least one durable billing callback required retry or reached dead letter in the last fifteen minutes.
          runbook_url: docs/runbooks/billing-payment-verification.md
          dashboard_url: http://localhost:3000/d/billing-operations

      - alert: PaymentWebhookBusinessQuarantine
        expr: |
          sum by (service, environment) (
            increase(billing_webhook_ingest_total{
              outcome=~"business_.*"
            }[15m])
          ) > 0
        for: 2m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
          component: billing-webhook
          team: platform
          slo: background-job-success
        annotations:
          summary: Authenticated payment callbacks are failing business validation
          description: A callback entered a bounded business-rule quarantine and requires safe investigation or provider reconciliation.
          runbook_url: docs/runbooks/billing-payment-verification.md
          dashboard_url: http://localhost:3000/d/billing-operations

      - alert: PaymentVerificationStalled
        expr: |
          max by (service, environment) (
            billing_payment_oldest_pending_age_seconds
          ) > 1800
          or
          max by (service, environment) (
            billing_subscription_oldest_incomplete_age_seconds
          ) > 3600
        for: 15m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: billing-reconciliation
          team: platform
          slo: background-job-success
        annotations:
          summary: Payment or subscription verification is stalled
          description: An unresolved payment or incomplete subscription has exceeded its bounded operational investigation threshold.
          runbook_url: docs/runbooks/billing-payment-verification.md
          dashboard_url: http://localhost:3000/d/billing-operations

      - alert: PaymentProviderReconciliationAttention
        expr: |
          sum by (service, environment) (
            increase(billing_provider_reconciliation_attempts_total{
              outcome=~"provider_failure|manual_review"
            }[15m])
          ) > 0
        for: 5m
        labels:
          severity: critical
          service: '{{ $labels.service }}'
          component: billing-reconciliation
          team: platform
          slo: background-job-success
        annotations:
          summary: Payment reconciliation needs operator attention
          description: Authenticated provider inquiry failed or returned an identity/state mismatch that cannot be corrected automatically.
          runbook_url: docs/runbooks/billing-payment-verification.md
          dashboard_url: http://localhost:3000/d/billing-operations

      - alert: TransactionalEmailDeliveryFailures
        expr: |
          sum by (service, environment, provider) (
            increase(transactional_email_delivery_total{
              final_status=~"retry|failed"
            }[15m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: transactional-email
          team: platform
          slo: background-job-success
        annotations:
          summary: Transactional email delivery is repeatedly failing
          description: Three or more retry or terminal-failure outcomes occurred in fifteen minutes.
          runbook_url: docs/runbooks/background-job-failures.md
          dashboard_url: http://localhost:3000/d/ai-operations

      - alert: TrainingFailures
        expr: |
          sum by (service, environment) (
            increase(training_jobs_failed_total[30m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: training-worker
          team: ai-platform
          slo: training-success
        annotations:
          summary: Training workflows are failing repeatedly
          description: At least three training jobs reached a terminal failed state in the last 30 minutes.
          runbook_url: docs/runbooks/training-failures.md
          dashboard_url: http://localhost:3000/d/ai-operations

      - alert: MonitoringRetrainingFailures
        expr: |
          (
            sum by (service, environment) (
              increase(
                monitoring_evaluations_total{final_status="failed"}[30m]
              )
            ) >= 3
          )
          or
          (
            sum by (service, environment) (
              increase(
                background_jobs_processed_total{
                  final_status="failed",
                  job_name=~"monitoring_evaluation|retraining_reconciliation"
                }[30m]
              )
            ) >= 3
          )
        for: 5m
        labels:
          severity: warning
          service: '{{ $labels.service }}'
          component: monitoring
          team: ai-platform
          slo: monitoring-success
        annotations:
          summary: Monitoring or retraining orchestration is failing
          description: Repeated evaluation or reconciliation failures were observed during the last 30 minutes.
          runbook_url: docs/runbooks/monitoring-retraining-failures.md
          dashboard_url: http://localhost:3000/d/ai-operations
